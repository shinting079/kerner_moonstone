name: Build Kernel Moonstone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libxml2-dev
    - name: Setup WeebX Clang
      run: |
        mkdir -p tc
        cd tc
        wget -q https://github.com/XSans0/WeebX-Clang/releases/latest/download/WeebX-Clang.tar.gz -O clang.tar.gz
        tar -xzf clang.tar.gz
        # foldernya kadang WeebX-Clang, rename jadi clang
        mv WeebX-Clang clang 2>/dev/null || mv weebx-clang clang 2>/dev/null || true
        ./clang/bin/clang --version
    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH"
        mkdir -p out
        make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 stone_defconfig
        make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all)
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Moonstone-Kernel-Image
        path: out/arch/arm64/boot/Image*
