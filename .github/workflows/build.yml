name: Build Morpheus Moonstone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libxml2-dev lld llvm ccache zip

    - name: Setup Clang (Anti 404)
      run: |
        rm -rf tc
        mkdir -p tc
        git clone --depth=1 https://github.[STRIPPED 71 bytes].git tc/clang
        tc/clang/bin/clang --version

    - name: Patch Kernel 5.4 buat Clang 17+
      run: |
        sed -i 's/typeof(x) __dummy2 = {};/typeof(x) __dummy2;/g' include/linux/typecheck.h
        sed -i 's/type __dummy = {};/type __dummy;/g' include/linux/typecheck.h

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        mkdir -p out
        
        if [ -f arch/arm64/configs/vendor/moonstone_defconfig ]; then
          DEFCONFIG=vendor/moonstone_defconfig
        else
          DEFCONFIG=moonstone_defconfig
        fi

        make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
        make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all)

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Moonstone-Kernel
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtbo.img
