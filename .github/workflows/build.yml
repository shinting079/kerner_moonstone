name: Build SkillIssue Moonstone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libxml2-dev lld llvm ccache zip binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Proton Clang
      shell: bash
      run: |
        rm -rf tc
        mkdir -p tc
        cd tc
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        rm -f clang/bin/ld clang/bin/ld.lld clang/bin/ld64.lld
        ./clang/bin/clang --version

    - name: Check Defconfig
      run: |
        ls arch/arm64/configs/ | grep -i stone
        # harusnya keluar stone_defconfig

    - name: Patch Kernel buat Clang baru
      run: |
        sed -i 's/typeof(x) __dummy2 = {};/typeof(x) __dummy2;/g' include/linux/typecheck.h
        sed -i 's/type __dummy = {};/type __dummy;/g' include/linux/typecheck.h

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        mkdir -p out

        # PAKAI stone_defconfig KARENA ITU YANG ADA DI REPO LU
        make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf stone_defconfig

        make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf -j$(nproc --all)

    - name: Package AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git anykernel
        rm -rf anykernel/.git
        
        # Tulis langsung isi anykernel.sh kustom
        cat << 'EOF' > anykernel/anykernel.sh
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers

        properties() { '
        kernel.string=SkillIssue Kernel for POCO X5 5G / Redmi Note 12 5G (stone)
        do.devicecheck=1
        device.name1=moonstone
        device.name2=sunstone
        device.name3=gemstone
        device.name4=stone
        do.cleanup=1
        '; }

        block=boot;
        is_slot_device=auto;
        no_block_display=1;

        . tools/ak3-core.sh;

        split_boot;
        flash_boot;
        EOF

        # Salin Image
        cp out/arch/arm64/boot/Image anykernel/
        
        # Salin dtbo.img jika ada
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img anykernel/
        
        # Gabungkan seluruh file .dtb ke folder AnyKernel3
        if [ -f out/arch/arm64/boot/dtb ]; then
          cp out/arch/arm64/boot/dtb anykernel/
        elif [ -d out/arch/arm64/boot/dts ]; then
          find out/arch/arm64/boot/dts/ -type f -name "*.dtb" -exec cat {} + > anykernel/dtb
        fi
        
        cd anykernel
        zip -r9 ../Moonstone-Kernel-Flashable.zip *

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Moonstone-Kernel-Flashable-Zip
        path: Moonstone-Kernel-Flashable.zip
