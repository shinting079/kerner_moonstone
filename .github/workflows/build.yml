name: Build Kernel Moonstone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev wget zip git

    - name: Setup Toolchain (Proton Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git tc/clang
        echo "$GITHUB_WORKSPACE/tc/clang/bin" >> $GITHUB_PATH

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        mkdir -p out
        make O=out stone_defconfig
        make O=out HOSTCC=gcc HOSTCXX=g++ -j$(nproc)

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonstone-Kernel-Image
        path: out/arch/arm64/boot/Image
