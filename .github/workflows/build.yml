name: Build Morpheus Moonstone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libxml2-dev lld llvm ccache zip

    - name: Setup 【entity-Proton¦canonical_name=Proton】 Clang
      shell: bash
      run: |
        rm -rf tc
        mkdir -p tc
        cd tc
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        # FIX 1: hapus ld jadul (fix error .relr.dyn)
        rm -f clang/bin/ld clang/bin/ld.lld clang/bin/ld64.lld
        ./clang/bin/clang --version

    - name: Patch Kernel 5.4 buat Clang baru
      run: |
        # FIX 2: fix error scalar initializer cannot be empty
        sed -i 's/typeof(x) __dummy2 = {};/typeof(x) __dummy2;/g' include/linux/typecheck.h
        sed -i 's/type __dummy = {};/type __dummy;/g' include/linux/typecheck.h
        cat include/linux/typecheck.h

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        mkdir -p out

        if [ -f arch/arm64/configs/vendor/moonstone_defconfig ]; then
          DEFCONFIG=vendor/moonstone_defconfig
        else
          DEFCONFIG=moonstone_defconfig
        fi

        make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf $DEFCONFIG

        make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf -j$(nproc --all)

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Moonstone-Morpheus
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtbo.img
