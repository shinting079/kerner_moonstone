    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev wget zip git lld llvm binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Toolchain (【entity-Proton¦canonical_name=Proton】 Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git tc/clang
        # INI KUNCINYA: hapus ld jadul biar tidak dipakai untuk HOST
        rm -f tc/clang/bin/ld tc/clang/bin/ld.lld tc/clang/bin/ld64.lld

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="runner"
        export KBUILD_BUILD_HOST="github-actions"
        
        mkdir -p out
        make O=out CC=clang HOSTCC=gcc HOSTCXX=g++ \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 LLVM_IAS=1 \
          stone_defconfig

        make O=out CC=clang HOSTCC=gcc HOSTCXX=g++ \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 LLVM_IAS=1 \
          -j$(nproc)
